                            : `Closest beach: ${escapeHtml(hotel.beachInfo.closestBeachDistance)}`;
                        parts.push(`<span style="color: #4b5563; font-size: 0.875rem;">${beachDisplay}</span>`);
                        console.log(`[Hotel View] Added closest beach to display: ${beachDisplay}`);
                    }
                    
                    // Show closest airport distance if available
                    if (hotel.beachInfo.closestAirportDistance) {
                        const airportDisplay = hotel.beachInfo.closestAirportName 
                            ? `${escapeHtml(hotel.beachInfo.closestAirportName)}: ${escapeHtml(hotel.beachInfo.closestAirportDistance)}`
                            : `Closest airport: ${escapeHtml(hotel.beachInfo.closestAirportDistance)}`;
                        parts.push(`<span style="color: #4b5563; font-size: 0.875rem;">${airportDisplay}</span>`);
                        console.log(`[Hotel View] Added closest airport to display: ${airportDisplay}`);
                    }
                    
                    if (parts.length > 0) {
                        beachInfoDisplay = parts.join('<br>');
                    } else if (hotel.beachInfo.summary) {
                        beachInfoDisplay = `<span style="color: #4b5563; font-size: 0.875rem;">${escapeHtml(hotel.beachInfo.summary)}</span>`;
                    } else {
                        // No info available after loading
                        beachInfoDisplay = '<span style="color: #9ca3af;">—</span>';
                    }
                } else {
                    // No beachInfo at all (not loading, just no data)
                    beachInfoDisplay = '<span style="color: #9ca3af;">—</span>';
                }
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 500; color: #111827;">
                        ${escapeHtml(hotel.name)}
                    </td>
                    <td style="padding: 12px; line-height: 1.8;">
                        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            ${datesDisplay}
                        </div>
                    </td>
                    <td style="white-space: nowrap; font-weight: 600; color: #111827;">
                        ${priceRange || '<span style="color: #9ca3af;">—</span>'}
                    </td>
                    <td style="white-space: nowrap; color: #4b5563; font-weight: 500;">
                        ${reviewDisplay || '<span style="color: #9ca3af;">—</span>'}
                    </td>
                    <td style="font-size: 0.875rem; min-width: 300px; max-width: 400px; word-wrap: break-word; white-space: normal; line-height: 1.6;">
                        ${beachInfoDisplay}
                    </td>
                    <td style="white-space: nowrap;">
                        <a href="${escapeHtml(hotel.url)}" target="_blank">Open ↗</a>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Function to switch between tabs
        window.switchTab = function(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');

            // If switching to hotel view, update it
            if (tabName === 'hotel-view') {
                updateHotelView();
            }
        };

        // Make escapeHtml available globally for template
        window.escapeHtml = escapeHtml;
    </script>
</body>
</html>
