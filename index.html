                            url = `https://www.booking.com/${url}`;
                        }
                        
                        // Normalize URL to base property URL (remove query parameters for grouping)
                        const normalizedUrl = this.normalizePropertyUrl(url);

                        // Extract price
                        const priceEl = card.querySelector(
                            'span[data-testid="price-and-discounted-price"], ' +
                            'div[data-testid="price-and-discounted-price"], ' +
                            'span.bui-price-display__value, ' +
                            'div.bui-price-display__value, ' +
                            'strong.price'
                        );
                        const price = priceEl ? priceEl.textContent.trim() : null;

                        // Extract rating
                        const ratingEl = card.querySelector(
                            'div[data-testid="review-score"], ' +
                            'div[data-testid="rating-score"], ' +
                            'div.bui-review-score__badge, ' +
                            'div.sr-review-score'
                        );
                        const rating = ratingEl ? ratingEl.textContent.trim() : null;
                        
                        // Extract numeric review score from rating text
                        let reviewScore = null;
                        if (rating) {
                            // Try to extract numeric score (e.g., "8.5" from "Scored 8.5" or "8.5Excellent")
                            const scoreMatch = rating.match(/(\d+\.?\d*)/);
                            if (scoreMatch) {
                                reviewScore = parseFloat(scoreMatch[1]);
                            }
                        }
                        
                        // Filter by minimum review score if specified
                        if (preferences.minReviewScore !== null && preferences.minReviewScore !== undefined) {
                            if (reviewScore === null || reviewScore < preferences.minReviewScore) {
                                skippedCount++;
                                skippedReasons.filter++;
                                return;
                            }
                        }

                        // Extract property type using comprehensive algorithm
                        const propertyType = this.extractPropertyType(url, title, card);
                        
                        // Filter by property type if specified (OR logic - match any selected type)
                        if (preferences.propertyType && preferences.propertyType.length > 0) {
                            const matchesAny = preferences.propertyType.some(requestedType => 
                                this.matchesPropertyType(propertyType, requestedType)
                            );
                            if (!matchesAny) {
                                skippedCount++;
                                skippedReasons.filter++;
                                return; // Exclude if doesn't match any selected type
                            }
                        }

                        // Extract basic beach information from card (will be enriched later from property page)
                        const beachInfo = this.extractBeachInfo(card);

                        results.push({
                            provider: 'booking',
                            destination: destination,
                            title: title,
                            url: url,
                            normalizedUrl: normalizedUrl,
                            price: price,
                            rating: rating,
                            reviewScore: reviewScore,
                            checkin: checkin,
                            checkout: checkout,
                            beachInfo: beachInfo,
                        });
                    } catch (error) {
                        skippedCount++;
                        skippedReasons.error++;
                        console.error(`Error parsing card ${index}:`, error);
                    }
                });

                // Log summary
                const parsedCount = results.length;
                const totalCards = cards.length;
                if (skippedCount > 0) {
                    console.log(`Parsed ${parsedCount} results from ${totalCards} cards (${skippedCount} skipped: ${JSON.stringify(skippedReasons)})`);
                } else {
                    console.log(`Parsed ${parsedCount} results from ${totalCards} cards`);
                }
                
                // If we found cards but parsed 0 results, this might indicate a parsing issue
                if (totalCards > 0 && parsedCount === 0 && skippedCount === 0) {
                    console.warn(`Warning: Found ${totalCards} cards but parsed 0 results. This might indicate a parsing issue.`);
                }
                
                return results;
            }

            extractPropertyType(url, title, card) {
                // Simplified and robust: classify only as 'hotel' or 'house'
                // based on URL and strong textual signals. We no longer try
                // to infer from star/award tooltips, as that's too brittle.
                const urlLower = (url || '').toLowerCase();
                const titleLower = (title || '').toLowerCase();
                let cardText = '';
                if (card) {
                    cardText = card.textContent.toLowerCase();
                }
                const allText = `${titleLower} ${urlLower} ${cardText}`;

                // 1) Clear house-type URL patterns
                if (
                    urlLower.includes('/apartment/') ||
                    urlLower.includes('/apartments/') ||
                    urlLower.includes('/villa/') ||
                    urlLower.includes('/villas/') ||
                    urlLower.includes('/holiday-home/') ||
                    urlLower.includes('/holiday-house/') ||
                    urlLower.includes('/holidayhome/')
                ) {
                    return 'house';
                }

                // 2) Strong house indicators in title / card text
                const houseIndicators = [
                    'apartment',
                    'apartamento',
                    'apartamentos',
                    'villa',
                    'villas',
                    'holiday home',
                    'holiday house',
                    'holiday cottage',
                    'cottage',
                    'chalet',
                    'bungalow',
                    'entire place',
                    'entire apartment',
                    'entire villa',
                    'home',
                    'house'
                ];

                for (const word of houseIndicators) {
                    if (allText.includes(word)) {
                        return 'house';
                    }
                }

                // 3) Fallback: anything else is treated as hotel
                return 'hotel';
            }

            normalizePropertyUrl(url) {
                try {
                    const urlObj = new URL(url);
                    // Extract base path (e.g., /hotel/es/property-name.html)
                    // Remove query parameters and hash
                    const baseUrl = `${urlObj.protocol}//${urlObj.host}${urlObj.pathname}`;
                    return baseUrl;
                } catch (e) {
                    // If URL parsing fails, try to extract base URL manually
                    try {
                        const match = url.match(/^(https?:\/\/[^\/]+\/[^?]+)/);
                        if (match) {
                            return match[1];
                        }
                    } catch (e2) {
                        // Last resort: remove query string
                        return url.split('?')[0].split('#')[0];
                    }
                    return url.split('?')[0].split('#')[0];
                }
            }

            extractBeachInfo(card) {
                if (!card) return null;
                
                const cardText = card.textContent || '';
                const cardTextLower = cardText.toLowerCase();
                const beachInfo = {
                    distance: null,
                    locationScore: null,
                    beachMentions: 0,
                    beachHighlights: [],
                    beachfront: false,
                    summary: null
                };
                
                // 1. Extract distance to beach
                // Look for patterns like "0.2 km from beach", "500 m from beach", "beachfront", "on the beach"
                const distancePatterns = [
                    /(\d+(?:\.\d+)?)\s*(?:km|kilometer|kilometre|m|meter|metre|mi|mile)\s*(?:from|to|away from)?\s*(?:the\s+)?beach/i,
                    /beachfront/i,
                    /on\s+(?:the\s+)?beach/i,
                    /beach\s+(?:front|side|access)/i,
                    /(\d+(?:\.\d+)?)\s*(?:min|minute|min\.)\s*(?:walk|walking)?\s*(?:to|from)?\s*(?:the\s+)?beach/i
                ];
                
                for (const pattern of distancePatterns) {
                    const match = cardText.match(pattern);
                    if (match) {
                        if (match[0].toLowerCase().includes('beachfront') || 
                            match[0].toLowerCase().includes('on the beach') ||
                            match[0].toLowerCase().includes('beach front')) {
                            beachInfo.distance = 'Beachfront';
                            beachInfo.beachfront = true;
                        } else if (match[1]) {
                            beachInfo.distance = match[0].trim();
                        }
                        break;
                    }
                }
                
                // 2. Extract location review score
                // Look for location score in badges or review sections
                const locationScoreEl = card.querySelector(
                    '[data-testid*="location"], ' +
                    '[class*="location"][class*="score"], ' +
                    '[class*="location"][class*="rating"], ' +
                    'span[class*="location-score"]'
                );
                if (locationScoreEl) {
                    const locationText = locationScoreEl.textContent || '';
                    const scoreMatch = locationText.match(/(\d+\.?\d*)/);
                    if (scoreMatch) {
                        beachInfo.locationScore = parseFloat(scoreMatch[1]);
                    }
                }
                
                // 3. Count beach mentions in the card
                const beachWords = ['beach', 'beachfront', 'seaside', 'seashore', 'coast', 'coastal', 'shore', 'waterfront'];
                let beachMentions = 0;
                for (const word of beachWords) {
                    const regex = new RegExp(`\\b${word}\\b`, 'gi');
                    const matches = cardText.match(regex);
                    if (matches) {
                        beachMentions += matches.length;
                    }
                }
                beachInfo.beachMentions = beachMentions;
                
                // 4. Extract beach-related highlights/badges
                const highlightEls = card.querySelectorAll(
                    '[data-testid*="badge"], ' +
                    '[data-testid*="highlight"], ' +
                    '[class*="badge"], ' +
                    '[class*="highlight"], ' +
                    '[class*="facility"], ' +
                    'span[class*="facility"]'
                );
                
                const beachHighlightKeywords = ['beach', 'beachfront', 'seaside', 'coast', 'coastal', 'shore', 'waterfront', 'sea view', 'ocean view'];
                highlightEls.forEach(el => {
                    const text = (el.textContent || '').toLowerCase();
                    for (const keyword of beachHighlightKeywords) {
                        if (text.includes(keyword)) {
                            beachInfo.beachHighlights.push(el.textContent.trim());
                            break;
                        }
                    }
                });
                
                // 5. Check for beachfront indicators in specific elements
                const locationEl = card.querySelector(
                    '[data-testid*="location"], ' +
                    '[class*="location"], ' +
                    '[class*="distance"], ' +
                    'div[class*="sr_card_address"]'
                );
                if (locationEl) {
                    const locationText = locationEl.textContent || '';
                    if (locationText.toLowerCase().includes('beachfront') || 
                        locationText.toLowerCase().includes('on the beach')) {
                        beachInfo.beachfront = true;
                        if (!beachInfo.distance) {
                            beachInfo.distance = 'Beachfront';
                        }
                    }
                }
                
                // 6. Generate summary
                const summaryParts = [];
                if (beachInfo.distance) {
                    summaryParts.push(beachInfo.distance);
                }
                if (beachInfo.locationScore !== null) {
                    summaryParts.push(`Location: ${beachInfo.locationScore}/10`);
                }
                if (beachInfo.beachMentions > 0) {
                    summaryParts.push(`${beachInfo.beachMentions} beach mention${beachInfo.beachMentions > 1 ? 's' : ''}`);
                }
                if (beachInfo.beachHighlights.length > 0) {
                    summaryParts.push(`${beachInfo.beachHighlights.length} highlight${beachInfo.beachHighlights.length > 1 ? 's' : ''}`);
                }
                if (summaryParts.length > 0) {
                    beachInfo.summary = summaryParts.join(' • ');
                } else {
                    beachInfo.summary = 'No beach info';
                }
                
                return beachInfo;
            }

            matchesPropertyType(extractedType, requestedType) {
                if (!extractedType) return false;

                const normalize = (t) => {
                    const v = (t || '').toLowerCase().trim();
                    if (!v) return 'hotel';

                    // Map various detailed types into the two buckets: hotel vs house
                    if (
                        v === 'hotel' ||
                        v === 'resort'
                    ) {
                        return 'hotel';
                    }

                    if (
                        v === 'house' ||
                        v === 'apartment' ||
                        v === 'villa' ||
                        v === 'guesthouse' ||
                        v === 'bed and breakfast' ||
                        v === 'holiday home' ||
                        v === 'holiday house' ||
                        v === 'cottage' ||
                        v === 'chalet' ||
                        v === 'bungalow'
                    ) {
                        return 'house';
                    }

                    // Unknown detailed type: default to hotel bucket
                    return 'hotel';
                };

                const extracted = normalize(extractedType);
                const requested = normalize(requestedType);

                return extracted === requested;
            }
        }

        // Initialize searcher
        const searcher = new BookingSearcher();

        // Handle form submission
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const button = document.getElementById('searchButton');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');

            // Hide previous results and errors
            error.style.display = 'none';
            resultsDiv.innerHTML = '';
            statsDiv.style.display = 'none';
            
            // Initialize window.allSearchResults if it doesn't exist
            if (!window.allSearchResults) {
                window.allSearchResults = [];
            } else {
                window.allSearchResults = []; // Clear previous results for hotel view
            }
            
            // Initialize window.dateStateMap if it doesn't exist
            if (!window.dateStateMap) {
                window.dateStateMap = new Map();
            }

            // Show loading
            button.disabled = true;
            loading.style.display = 'block';
            
            // Reset cancellation flag for new search
            window.searchCancelled = false;

            try {
                // Get form values
                const destinations = document.getElementById('destinations').value
                    .split(',')
                    .map(d => d.trim())
                    .filter(d => d);

                const closeToCenter = document.getElementById('closeToCenter').value;
                const maxTransfer = document.getElementById('maxTransfer').value;
                const bathrooms = document.getElementById('bathrooms').value;
                const minStayLength = document.getElementById('minStayLength').value;
                const maxStayLength = document.getElementById('maxStayLength').value;
                const childAgesInput = document.getElementById('childAges').value.trim();
                const parsedChildAges = childAgesInput
                    .split(',')
                    .map(a => a.trim())
                    .filter(a => a !== '')
                    .map(a => parseInt(a, 10))
                    .filter(a => !isNaN(a) && a >= 0 && a <= 17);
                
                // Infer number of children from childAges: 0 if empty, otherwise count comma-separated values
                // This is equivalent to "number of commas + 1" for valid inputs
                const numberOfChildren = childAgesInput === '' ? 0 : parsedChildAges.length;

                // Get selected property types (checkboxes - OR logic, hotel vs house)
                const selectedPropertyTypes = [];
                if (document.getElementById('propertyTypeHotel').checked) selectedPropertyTypes.push('hotel');
                if (document.getElementById('propertyTypeHouse').checked) selectedPropertyTypes.push('house');
                
                const minReviewScore = document.getElementById('minReviewScore').value;

                const criteria = {
                    destinations: destinations,
                    checkin: document.getElementById('checkin').value,
                    checkout: document.getElementById('checkout').value,
                    checkinFlex: {
                        daysBefore: parseInt(document.getElementById('checkinFlexBefore').value) || 0,
                        daysAfter: parseInt(document.getElementById('checkinFlexAfter').value) || 0,
                    },
                    checkoutFlex: {
                        daysBefore: parseInt(document.getElementById('checkoutFlexBefore').value) || 0,
                        daysAfter: parseInt(document.getElementById('checkoutFlexAfter').value) || 0,
                    },
                    minStayLength: minStayLength ? parseInt(minStayLength) : null,
                    maxStayLength: maxStayLength ? parseInt(maxStayLength) : null,
                    occupancy: {
                        adults: parseInt(document.getElementById('adults').value),
                        children: numberOfChildren,
                        rooms: parseInt(document.getElementById('rooms').value),
                    },
                    childAges: parsedChildAges,
                    preferences: {
                        propertyType: selectedPropertyTypes.length > 0 ? selectedPropertyTypes : null,
                        minReviewScore: minReviewScore ? parseFloat(minReviewScore) : null,
                        freeCancellation: document.getElementById('freeCancellation').checked,
                        pool: document.getElementById('pool').checked,
                        beachfront: document.getElementById('beachfront').checked,
                        niceBeach: document.getElementById('niceBeach').checked,
                        allInclusive: document.getElementById('allInclusive').checked,
                        largeRoom: document.getElementById('largeRoom').checked,
                        lift: document.getElementById('lift').checked,
                        groundFloor: document.getElementById('groundFloor').checked,
                        closeToCenterMinutes: closeToCenter ? parseInt(closeToCenter) : null,
                        maxTransferMinutes: maxTransfer ? parseInt(maxTransfer) : null,
                        bathrooms: bathrooms ? parseInt(bathrooms) : null,
                    },
                };

                // Calculate total searches for progress (before filtering by stay length)
                const checkinRange = criteria.checkinFlex.daysBefore + criteria.checkinFlex.daysAfter + 1;
                const checkoutRange = criteria.checkoutFlex.daysBefore + criteria.checkoutFlex.daysAfter + 1;
                const maxPossibleSearches = criteria.destinations.length * checkinRange * checkoutRange;
                
                // Generate date combinations to get actual count after filtering
                const dateCombinations = searcher.generateDateCombinations(
                    criteria.checkin,
                    criteria.checkout,
                    criteria.checkinFlex,
                    criteria.checkoutFlex,
                    criteria.minStayLength,
                    criteria.maxStayLength
                );
                const actualSearches = criteria.destinations.length * dateCombinations.length;
                
                // Update loading text
                const loadingText = document.getElementById('loadingText');
                if (actualSearches > 1) {
                    let message = `Searching ${actualSearches} date combination${actualSearches > 1 ? 's' : ''}...`;
                    if (actualSearches < maxPossibleSearches) {
                        message += ` (${maxPossibleSearches - actualSearches} filtered by stay length)`;
                    }
                    loadingText.textContent = message;
                }

                // Pre-render table with all date combinations
                const formatDate = (dateStr) => {
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                };

                // Sort date combinations
                const sortedDateCombinations = [...dateCombinations].sort((a, b) => {
                    const dateA = new Date(a[0]);
                    const dateB = new Date(b[0]);
                    return dateA - dateB;
                });

                // Build tabs and initial table structure
                let tableHtml = `
                    <div id="global-status-bar" style="background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span id="global-status-text" style="font-weight: 500; color: #374151;">Loading...</span>
                            <span id="global-status-percentage" style="color: #6b7280; margin-left: 8px;"></span>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button id="stop-search-btn" onclick="stopSearch()" 
                                    class="stop-button" 
                                    style="display: none;"
                                    title="Stop the current search">
                                ⏹ Stop
                            </button>
                            <button id="retry-all-failed-btn" onclick="retryAllFailed()" 
                                    class="reload-button" 
                                    style="display: none;"
                                    title="Retry all failed date combinations">
                                ↻ Retry All Failed
                            </button>
                        </div>
                    </div>
                    <div class="tabs">
                        <button class="tab-button active" onclick="switchTab('date-view')" id="tab-date-view">Date View</button>
                        <button class="tab-button" onclick="switchTab('hotel-view')" id="tab-hotel-view">Hotel View</button>
                    </div>
                    <div id="date-view" class="tab-content active">
                        <table>
                            <thead>
                                <tr>
                                    <th>Property</th>
                                    <th>Price</th>
                                    <th>Review score</th>
                                    <th>Location Info</th>
                                    <th>Link</th>
                                </tr>
                            </thead>
                            <tbody id="results-tbody">
                `;

                // Create a map to track state for each date combination
                const dateStateMap = new Map();
                window.dateStateMap = dateStateMap; // Make accessible to global functions
                sortedDateCombinations.forEach(([checkin, checkout]) => {
                    const dateKey = `${checkin}_${checkout}`;
                    const safeId = dateKey.replace(/[^a-zA-Z0-9]/g, '-');
                    dateStateMap.set(dateKey, {
                        checkin,
                        checkout,
                        status: 'pending', // pending, loading, success, error
                        results: [],
                        error: null,
                        headerRowId: `date-header-${safeId}`,
                        statusSpanId: `date-status-${safeId}`,
                        containerId: `date-container-${safeId}`
                    });

                    // Add date header row and container for properties
                    tableHtml += `
                        <tr class="date-header-row" id="date-header-${safeId}">
                            <td colspan="5" id="date-header-content-${safeId}" style="display: flex; justify-content: space-between; align-items: center;">
                                <span>
                                    ${formatDate(checkin)} → ${formatDate(checkout)} <span id="date-status-${safeId}" style="color: #6b7280; font-weight: 500;">(loading...)</span>
                                </span>
                                <button onclick="retryDateSearch('${dateKey}', '${escapeHtml(checkin)}', '${escapeHtml(checkout)}')" 
                                        class="reload-button" 
                                        title="Reload this date combination">
                                    ↻ Reload
                                </button>
                            </td>
                        </tr>
                        <tr id="date-container-${safeId}">
                            <td colspan="5" style="padding: 0;">
                                <div id="date-properties-${safeId}"></div>
                            </td>
                        </tr>
                    `;
                });

                tableHtml += `
                            </tbody>
                        </table>
                    </div>
                    <div id="hotel-view" class="tab-content">
                        <table>
                            <thead>
                                <tr>
                                    <th>Property</th>
                                    <th>Available Dates</th>
                                    <th>Price Range</th>
                                    <th>Review Score</th>
                                    <th>Location Info</th>
                                    <th>Link</th>
                                </tr>
                            </thead>
                            <tbody id="hotel-results-tbody">
                            </tbody>
                        </table>
                    </div>
                `;

                resultsDiv.innerHTML = tableHtml;

                // Function to update global status
                const updateGlobalStatus = () => {
                    const statusBar = document.getElementById('global-status-text');
                    const percentageSpan = document.getElementById('global-status-percentage');
                    const retryAllBtn = document.getElementById('retry-all-failed-btn');
                    const stopBtn = document.getElementById('stop-search-btn');
                    
                    if (!statusBar || !percentageSpan) return;
                    
                    let total = 0;
                    let success = 0;
                    let error = 0;
                    let loading = 0;
                    let retrying = 0;
                    
                    dateStateMap.forEach((state) => {
                        total++;
                        if (state.status === 'success') {
                            success++;
                        } else if (state.status === 'error') {
                            error++;
                        } else if (state.status === 'loading') {
                            loading++;
                        } else if (state.status === 'retrying') {
                            retrying++;
                        }
                    });
                    
                    const percentage = total > 0 ? Math.round((success / total) * 100) : 0;
                    const isSearching = loading > 0 || retrying > 0;
                    const isCancelled = window.searchCancelled;
                    
                    if (isCancelled) {
                        statusBar.textContent = `Cancelled: ${success} succeeded, ${error} failed`;
                        statusBar.style.color = '#f59e0b';
                    } else if (isSearching) {
                        statusBar.textContent = `Loading: ${success} succeeded, ${loading + retrying} in progress, ${error} failed`;
                        statusBar.style.color = '#374151';
                    } else if (error > 0) {
                        statusBar.textContent = `Complete: ${success} succeeded, ${error} failed`;
                        statusBar.style.color = error === total ? '#dc2626' : '#f59e0b';
                    } else {
                        statusBar.textContent = `Complete: All ${success} date combinations succeeded`;
                        statusBar.style.color = '#059669';
                    }
                    
                    percentageSpan.textContent = `(${percentage}%)`;
                    percentageSpan.style.color = percentage === 100 ? '#059669' : percentage >= 50 ? '#f59e0b' : '#dc2626';
                    
                    // Show/hide stop button based on search status
                    if (stopBtn) {
                        stopBtn.style.display = (isSearching && !isCancelled) ? 'inline-block' : 'none';
                    }
                    
                    // Show retry all button if there are failed combinations (and not searching)
                    if (retryAllBtn) {
                        retryAllBtn.style.display = (error > 0 && !isSearching) ? 'inline-block' : 'none';
                    }
                };
                
                // Make updateGlobalStatus globally accessible
                window.updateGlobalStatus = updateGlobalStatus;
                
                // Initialize global status
                setTimeout(() => updateGlobalStatus(), 100);
                
                // Function to update a date combination's results
                const updateDateResults = (dateKey, checkin, checkout, results, status, error, retryCount = 0) => {
                    const safeId = dateKey.replace(/[^a-zA-Z0-9]/g, '-');
                    const container = document.getElementById(`date-properties-${safeId}`);
                    const statusSpan = document.getElementById(`date-status-${safeId}`);
                    
                    if (!container) {
                        console.warn(`Container not found for dateKey: ${dateKey}, safeId: ${safeId}`);
                        console.warn(`Looking for: date-properties-${safeId}`);
                        console.warn(`Available containers:`, Array.from(document.querySelectorAll('[id^="date-properties-"]')).map(el => el.id));
                        return;
                    }
                    
                    console.log(`Updating results for ${dateKey}: status=${status}, results count=${results ? results.length : 0}`);
                    
                    // Update state map
                    if (dateStateMap.has(dateKey)) {
                        dateStateMap.get(dateKey).status = status;
                        dateStateMap.get(dateKey).results = results || [];
                        dateStateMap.get(dateKey).error = error || null;
                    }
                    
                    // Update global status
                    updateGlobalStatus();

                    // Update status in header
                    if (statusSpan) {
                        if (status === 'loading') {
                            statusSpan.textContent = '(loading...)';
                            statusSpan.style.color = '#6b7280';
                            statusSpan.style.fontWeight = '500';
                        } else if (status === 'retrying') {
                            statusSpan.textContent = `(retrying ${retryCount}/10...)`;
                            statusSpan.style.color = '#f59e0b';
                            statusSpan.style.fontWeight = '500';
                        } else if (status === 'error') {
                            statusSpan.textContent = '';
                        } else if (status === 'success') {
                            // Count unique properties
                            const uniqueCount = new Set(results.map(r => r.normalizedUrl || r.url)).size;
                            statusSpan.textContent = `(${uniqueCount} properties)`;
                            statusSpan.style.color = '#059669';
                            statusSpan.style.fontWeight = '500';
                        }
                    }

                    // Clear existing property rows for this date combination
                    const tbody = document.getElementById('results-tbody');
                    if (tbody) {
                        const existingRows = tbody.querySelectorAll(`tr[data-date-key="${dateKey}"]`);
                        existingRows.forEach(row => row.remove());
                    }
                    
                    // Clear container content
                    container.innerHTML = '';

                    if (status === 'error') {
                        // Show error message with retry button
                        const errorMsg = error && typeof error === 'string' ? error : (error?.message || String(error) || 'Unknown error');
                        container.innerHTML = `
                            <div style="padding: 16px 20px; color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; margin: 8px;">
                                <span style="margin-right: 12px;">❌ Search failed: ${escapeHtml(errorMsg)}</span>
                                <button onclick="retryDateSearch('${dateKey}', '${escapeHtml(checkin)}', '${escapeHtml(checkout)}')" 
                                        style="padding: 6px 16px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: background-color 0.15s;">
                                    Retry
                                </button>
                            </div>
                        `;
                    } else if (status === 'success') {
                        // Remove old results for this date combination before adding new ones
                        window.allSearchResults = window.allSearchResults.filter(r => r.dateKey !== dateKey);
                        
                        // Store results globally for hotel view
                        results.forEach(result => {
                            if (result.url && result.title) {
                                if (!result.normalizedUrl && result.url) {
                                    result.normalizedUrl = searcher.normalizePropertyUrl(result.url);
                                }
                                // Add date info to result
                                result.dateKey = dateKey;
                                result.checkin = checkin;
                                result.checkout = checkout;
                                window.allSearchResults.push(result);
                            }
                        });
                        
                        // Deduplicate properties by normalized URL for this date
                        const propertiesByKey = new Map();
                        results.forEach(result => {
                            if (!result.url || !result.title) return;
                            
                            if (!result.normalizedUrl && result.url) {
                                result.normalizedUrl = searcher.normalizePropertyUrl(result.url);
                            }
                            const key = result.normalizedUrl || result.url;
                            
                            if (!propertiesByKey.has(key)) {
                                propertiesByKey.set(key, {
                                    name: result.title,
                                    price: result.price,
                                    reviewScore: result.reviewScore,
                                    ratingText: result.rating,
                                    url: result.url,
                                    beachInfo: result.beachInfo || null
                                });
                            } else {
                                const existing = propertiesByKey.get(key);
                                if (!existing.price && result.price) existing.price = result.price;
                                if (existing.reviewScore === null && result.reviewScore !== null) {
                                    existing.reviewScore = result.reviewScore;
                                    existing.ratingText = result.rating;
                                }
                                // Update beachInfo if we have new data
                                if (result.beachInfo) {
                                    // Merge beachInfo, preferring non-null values
                                    if (!existing.beachInfo) {
                                        existing.beachInfo = result.beachInfo;
                                    } else {
                                        // Merge: keep locationScore if we have it, update beachRating if we have it
                                        if (result.beachInfo.locationScore !== null && result.beachInfo.locationScore !== undefined) {
                                            existing.beachInfo.locationScore = result.beachInfo.locationScore;
                                        }
                                        if (result.beachInfo.beachRating !== null && result.beachInfo.beachRating !== undefined) {
                                            // Ensure it's a number
                                            const rating = typeof result.beachInfo.beachRating === 'string' 
                                                ? parseFloat(result.beachInfo.beachRating) 
                                                : result.beachInfo.beachRating;
                                            if (!isNaN(rating) && rating >= 1 && rating <= 10) {
                                                existing.beachInfo.beachRating = rating;
                                            }
                                        }
                                        if (result.beachInfo.beachRatingText) {
                                            existing.beachInfo.beachRatingText = result.beachInfo.beachRatingText;
                                        }
                                        if (result.beachInfo.summary) {
                                            existing.beachInfo.summary = result.beachInfo.summary;
                                        }
                                    }
                                }
                            }
                        });
                        
                        // Update hotel view
                        updateHotelView();

                        const properties = Array.from(propertiesByKey.values());
                        
                        if (properties.length === 0) {
                            // Show "no properties" message as a table row
                            const tbody = document.getElementById('results-tbody');
                            const containerRow = document.getElementById(`date-container-${safeId}`);
                            if (tbody && containerRow) {
                                const noResultsRow = document.createElement('tr');
                                noResultsRow.setAttribute('data-date-key', dateKey);
                                noResultsRow.innerHTML = `
                                    <td colspan="5" style="padding: 16px; color: #6b7280; font-style: italic; text-align: center;">
                                        No properties found for this date combination
                                    </td>
                                `;
                                tbody.insertBefore(noResultsRow, containerRow);
                            }
                        } else {
                            // Build table rows for properties - insert directly into tbody
                            const tbody = document.getElementById('results-tbody');
                            const containerRow = document.getElementById(`date-container-${safeId}`);
                            
                            if (tbody && containerRow) {
                                properties.forEach(prop => {
                                    const reviewDisplay =
                                        prop.reviewScore !== null && prop.reviewScore !== undefined
                                            ? prop.reviewScore.toFixed(1)
                                            : '';

                                    const row = document.createElement('tr');
                                    row.setAttribute('data-date-key', dateKey);
                                    
                                    // Format beach info - show location score and beach rating
                                    // Check if beachInfo is being loaded (currently fetching)
                                    const normalizedUrl = prop.url ? searcher.normalizePropertyUrl(prop.url) : null;
                                    const isBeachInfoLoading = normalizedUrl && 
                                        searcher.beachInfoFetching && 
                                        searcher.beachInfoFetching.has(normalizedUrl);
                                    
                                    let beachInfoDisplay = '';
                                    if (isBeachInfoLoading) {
                                        beachInfoDisplay = '<span style="color: #6b7280; font-size: 0.875rem; font-style: italic;">Loading...</span>';
                                    } else if (prop.beachInfo) {
                                        console.log(`[Dates View] Property ${prop.name} beachInfo:`, prop.beachInfo);
                                        const parts = [];
                                        
                                        // Always show location score if available
                                        if (prop.beachInfo.locationScore !== null && 
                                            prop.beachInfo.locationScore !== undefined && 
                                            !isNaN(prop.beachInfo.locationScore)) {
                                            const locationScore = prop.beachInfo.locationScore;
                                            const scoreColor = locationScore >= 8 ? '#059669' : locationScore >= 6 ? '#f59e0b' : '#dc2626';
                                            parts.push(`<span style="color: ${scoreColor}; font-size: 0.875rem; font-weight: 500;">Location: ${locationScore}/10</span>`);
                                        }
                                        
                                        // Show beach rating if available (optional)
                                        console.log(`[Dates View] Checking beachRating: ${prop.beachInfo.beachRating}, type: ${typeof prop.beachInfo.beachRating}, isNaN: ${isNaN(prop.beachInfo.beachRating)}`);
                                        
                                        // Convert to number if it's a string and validate
                                        let beachRatingValue = prop.beachInfo.beachRating;
                                        if (typeof beachRatingValue === 'string') {
                                            beachRatingValue = parseFloat(beachRatingValue);
                                        }
                                        
                                        // Round to 1 decimal place and validate
                                        if (beachRatingValue !== null && 
                                            beachRatingValue !== undefined && 
                                            !isNaN(beachRatingValue)) {
                                            beachRatingValue = Math.round(beachRatingValue * 10) / 10;
                                            
                                            // "Top-rated beach nearby" should have a reasonable rating (at least 4.0)
                                            if (beachRatingValue >= 4.0 && beachRatingValue <= 10) {
                                                const beachColor = beachRatingValue >= 8 ? '#059669' : beachRatingValue >= 6 ? '#f59e0b' : '#dc2626';
                                                parts.push(`<span style="color: ${beachColor}; font-size: 0.875rem; font-weight: 500;">Beach: ${beachRatingValue}/10</span>`);
                                                console.log(`[Dates View] Added beach rating to display: ${beachRatingValue}`);
                                            } else {
                                                console.log(`[Dates View] Beach rating ${beachRatingValue} is out of valid range (4.0-10.0), not displaying`);
                                            }
                                        }
                                        
                                        // Show beachRatingText as fallback only if we don't have a valid numeric rating
                                        if (parts.length === 0 || (parts.length === 1 && parts[0].includes('Location:'))) {
                                            if (prop.beachInfo.beachRatingText) {
                                                parts.push(`<span style="color: #4b5563; font-size: 0.875rem;">${escapeHtml(prop.beachInfo.beachRatingText)}</span>`);
                                                console.log(`[Dates View] Added beachRatingText to display: ${prop.beachInfo.beachRatingText}`);
                                            }
                                        }
                                        
                                        // Show closest beach distance if available
                                        if (prop.beachInfo.closestBeachDistance) {
                                            const beachDisplay = prop.beachInfo.closestBeachName 
                                                ? `${escapeHtml(prop.beachInfo.closestBeachName)}: ${escapeHtml(prop.beachInfo.closestBeachDistance)}`
                                                : `Closest beach: ${escapeHtml(prop.beachInfo.closestBeachDistance)}`;
                                            parts.push(`<span style="color: #4b5563; font-size: 0.875rem;">${beachDisplay}</span>`);
                                            console.log(`[Dates View] Added closest beach to display: ${beachDisplay}`);
                                        }
                                        
                                        // Show closest airport distance if available
                                        if (prop.beachInfo.closestAirportDistance) {
                                            const airportDisplay = prop.beachInfo.closestAirportName 
                                                ? `${escapeHtml(prop.beachInfo.closestAirportName)}: ${escapeHtml(prop.beachInfo.closestAirportDistance)}`
                                                : `Closest airport: ${escapeHtml(prop.beachInfo.closestAirportDistance)}`;
                                            parts.push(`<span style="color: #4b5563; font-size: 0.875rem;">${airportDisplay}</span>`);
                                            console.log(`[Dates View] Added closest airport to display: ${airportDisplay}`);
                                        }
                                        
                                        if (parts.length > 0) {
                                            beachInfoDisplay = parts.join('<br>');
                                        } else if (prop.beachInfo.summary) {
                                            beachInfoDisplay = `<span style="color: #4b5563; font-size: 0.875rem;">${escapeHtml(prop.beachInfo.summary)}</span>`;
                                        } else {
                                            // No info available after loading
                                            beachInfoDisplay = '<span style="color: #9ca3af;">—</span>';
                                        }
                                    }
                                    
                                    row.innerHTML = `
                                        <td style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px;">
                                            ${escapeHtml(prop.name)}
                                        </td>
                                        <td style="white-space: nowrap; font-weight: 600; color: #111827;">
                                            ${prop.price ? escapeHtml(prop.price) : '<span style="color: #9ca3af;">—</span>'}
                                        </td>
                                        <td style="white-space: nowrap; color: #4b5563;">
                                            ${reviewDisplay || '<span style="color: #9ca3af;">—</span>'}
                                        </td>
                                        <td style="font-size: 0.875rem; min-width: 300px; max-width: 400px; word-wrap: break-word; white-space: normal; line-height: 1.6;">
                                            ${beachInfoDisplay}
                                        </td>
                                        <td style="white-space: nowrap;">
                                            <a href="${escapeHtml(prop.url)}" target="_blank">Open ↗</a>
                                        </td>
                                    `;
                                    // Insert before the container row
                                    tbody.insertBefore(row, containerRow);
                                });
                            }
                        }
                    }
                };

                // Retry function (needs to be global for onclick)
                // Store criteria in closure for retry function
                window.currentSearchCriteria = criteria;
                window.retryDateSearch = async (dateKey, checkin, checkout) => {
                    const safeId = dateKey.replace(/[^a-zA-Z0-9]/g, '-');
                    const statusSpan = document.getElementById(`date-status-${safeId}`);
                    if (statusSpan) {
                        statusSpan.textContent = '(loading...)';
                    }
                    
                    updateDateResults(dateKey, checkin, checkout, [], 'loading', null);
                    
                    try {
                        // Search all destinations for this date combination
                        const allResults = [];
                        for (const destination of window.currentSearchCriteria.destinations) {
                            try {
                                const destinationResults = await searcher.searchDestination(
                                    destination,
                                    checkin,
                                    checkout,
                                    window.currentSearchCriteria.occupancy,
                                    window.currentSearchCriteria.childAges,
                                    window.currentSearchCriteria.preferences
                                );
                                allResults.push(...destinationResults);
                            } catch (destError) {
                                console.error(`Error retrying ${destination}:`, destError);
                                // Continue with other destinations
                            }
                        }
                        updateDateResults(dateKey, checkin, checkout, allResults, 'success', null);
                    } catch (error) {
                        updateDateResults(dateKey, checkin, checkout, [], 'error', error.message || 'Search failed');
                    }
                };
                
                // Stop search function
                window.stopSearch = () => {
                    console.log('Stopping search...');
                    window.searchCancelled = true;
                    
                    // Update all pending/loading/retrying date combinations to cancelled
                    if (window.dateStateMap) {
                        window.dateStateMap.forEach((state, dateKey) => {
                            if (state.status === 'pending' || state.status === 'loading' || state.status === 'retrying') {
                                state.status = 'error';
                                state.error = 'Search cancelled';
                                
                                // Update UI for this date combination
                                const safeId = dateKey.replace(/[^a-zA-Z0-9]/g, '-');
                                const statusSpan = document.getElementById(`date-status-${safeId}`);
                                const container = document.getElementById(`date-properties-${safeId}`);
                                
                                if (statusSpan) {
                                    statusSpan.textContent = '';
                                }
                                
                                if (container) {
                                    container.innerHTML = `
                                        <div style="padding: 16px 20px; color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; margin: 8px;">
                                            <span>⏹ Search cancelled</span>
                                        </div>
                                    `;
                                }
                            }
                        });
                    }
                    
                    // Update global status
                    if (window.updateGlobalStatus) {
                        window.updateGlobalStatus();
                    } else {
                        // Fallback: trigger update via setTimeout
                        setTimeout(() => {
                            const updateGlobalStatus = window.updateGlobalStatus;
                            if (updateGlobalStatus) updateGlobalStatus();
                        }, 100);
                    }
                };
                
                // Retry all failed date combinations
                window.retryAllFailed = async () => {
                    if (!window.dateStateMap) {
                        console.log('No date state map available');
                        return;
                    }
                    
                    const failedCombinations = [];
                    window.dateStateMap.forEach((state, dateKey) => {
                        if (state.status === 'error') {
                            failedCombinations.push({
                                dateKey,
                                checkin: state.checkin,
                                checkout: state.checkout
                            });
                        }
                    });
                    
                    if (failedCombinations.length === 0) {
                        console.log('No failed combinations to retry');
                        return;
                    }
                    
                    console.log(`Retrying ${failedCombinations.length} failed date combinations...`);
                    
                    // Retry each failed combination
                    for (const combo of failedCombinations) {
                        await window.retryDateSearch(combo.dateKey, combo.checkin, combo.checkout);
                        // Small delay between retries to avoid hammering
                        await new Promise(resolve => setTimeout(resolve, 500));
                    }
                };

                // Progress callback
                const onProgress = (progress) => {
                    const retryCount = progress.retryCount || 0;
                    if (progress.status === 'loading') {
                        updateDateResults(progress.dateKey, progress.checkin, progress.checkout, [], 'loading', null, retryCount);
                    } else if (progress.status === 'retrying') {
                        updateDateResults(progress.dateKey, progress.checkin, progress.checkout, [], 'retrying', null, retryCount);
                    } else if (progress.status === 'success') {
                        updateDateResults(progress.dateKey, progress.checkin, progress.checkout, progress.results, 'success', null, retryCount);
                    } else if (progress.status === 'error') {
                        updateDateResults(progress.dateKey, progress.checkin, progress.checkout, [], 'error', progress.error, retryCount);
                    }
                };

                // Perform search with progress callback
                console.log('Starting search...');
                const results = await searcher.search(criteria, onProgress);
                console.log(`Search completed. Total results: ${results ? results.length : 0}`);

                // Hide loading
                loading.style.display = 'none';
                button.disabled = false;
                
                // Debug: Check if results are being displayed
                console.log('Results after search:', results);
                console.log('window.allSearchResults:', window.allSearchResults);
                console.log('window.allSearchResults length:', window.allSearchResults ? window.allSearchResults.length : 0);
                
                // Update global status to hide stop button
                if (window.updateGlobalStatus) {
                    window.updateGlobalStatus();
                }
                
                // Enrich results with beach info from property pages (after table is loaded)
                // Use window.allSearchResults which has dateKey set
                console.log('Starting beach info enrichment for all results...');
                setTimeout(() => {
                    if (window.allSearchResults && window.allSearchResults.length > 0) {
                        searcher.enrichBeachInfoAndUpdateUI(window.allSearchResults, updateDateResults, updateHotelView).catch(error => {
                            console.error('Error enriching beach info:', error);
                        });
                    }
                }, 1000); // Wait 1 second for UI to fully render

                // Show stats
                if (results.length > 0) {
                    // Count unique properties (by normalized URL)
                    const uniqueResults = new Set();
                    results.forEach(result => {
                        const key = result.normalizedUrl || result.url;
                        uniqueResults.add(key);
                    });
                    
                    const uniqueCount = uniqueResults.size;
                    const checkinRange = criteria.checkinFlex.daysBefore + criteria.checkinFlex.daysAfter + 1;
                    const checkoutRange = criteria.checkoutFlex.daysBefore + criteria.checkoutFlex.daysAfter + 1;
                    const maxPossibleSearches = criteria.destinations.length * checkinRange * checkoutRange;
                    
                    // Calculate actual searches (after stay length filtering)
                    const dateCombinations = searcher.generateDateCombinations(
                        criteria.checkin,
                        criteria.checkout,
                        criteria.checkinFlex,
                        criteria.checkoutFlex,
                        criteria.minStayLength,
                        criteria.maxStayLength
                    );
                    const actualSearches = criteria.destinations.length * dateCombinations.length;
                    
                    let statsHtml = `
                        <h2>Search Results</h2>
                        <p>Found <strong>${results.length}</strong> total results</p>
                        <p><strong>${uniqueCount}</strong> unique properties</p>
                        <p>Searched <strong>${actualSearches}</strong> date combination(s)`;
                    
                    if (criteria.minStayLength || criteria.maxStayLength) {
                        let stayLengthInfo = ' (filtered by stay length: ';
                        if (criteria.minStayLength && criteria.maxStayLength) {
                            stayLengthInfo += `${criteria.minStayLength}-${criteria.maxStayLength} nights`;
                        } else if (criteria.minStayLength) {
                            stayLengthInfo += `min ${criteria.minStayLength} nights`;
                        } else {
                            stayLengthInfo += `max ${criteria.maxStayLength} nights`;
                        }
                        stayLengthInfo += ')';
                        statsHtml += stayLengthInfo;
                    }
                    
                    if (actualSearches < maxPossibleSearches) {
                        statsHtml += ` (${maxPossibleSearches - actualSearches} combinations filtered out)`;
                    }
                    
                    statsHtml += `</p>`;
                    
                    // Show applied filters
                    const appliedFilters = [];
                    if (criteria.preferences.minReviewScore !== null) {
                        appliedFilters.push(`Min review score: ${criteria.preferences.minReviewScore}`);
                    }
                    if (criteria.preferences.propertyType && criteria.preferences.propertyType.length > 0) {
                        const typeLabels = {
                            'hotel': 'Hotel',
                            'house': 'House'
                        };
                        const typeDisplay = criteria.preferences.propertyType.map(t => typeLabels[t] || t).join(', ');
                        appliedFilters.push(`Property types (OR): ${typeDisplay}`);
                    }
                    if (appliedFilters.length > 0) {
                        statsHtml += `<p style="font-size: 0.9em; color: #666; margin-top: 10px;"><strong>Applied filters:</strong> ${appliedFilters.join(' | ')}</p>`;
                    }
                    
                    statsDiv.style.display = 'block';
                    statsDiv.innerHTML = statsHtml;
                }

                // Results are displayed dynamically via onProgress callback
                // No need for static display here
            } catch (err) {
                loading.style.display = 'none';
                button.disabled = false;
                error.style.display = 'block';
                error.textContent = err.message || 'An error occurred during the search.';
                console.error('Search error:', err);
            }
        });

        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Function to update hotel view (grouped by hotel)
        function updateHotelView() {
            if (!window.allSearchResults || window.allSearchResults.length === 0) {
                const tbody = document.getElementById('hotel-results-tbody');
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="6" style="padding: 16px; color: #6b7280; font-style: italic; text-align: center;">No results yet</td></tr>';
                }
                return;
            }

            // Group results by hotel (normalized URL)
            const hotelsMap = new Map();
            
            window.allSearchResults.forEach(result => {
                if (!result.url || !result.title) return;
                
                const key = result.normalizedUrl || result.url;
                
                if (!hotelsMap.has(key)) {
                    hotelsMap.set(key, {
                        name: result.title,
                        url: result.url,
                        normalizedUrl: key,
                        dates: [],
                        prices: [],
                        reviewScore: result.reviewScore,
                        ratingText: result.rating,
                        beachInfo: result.beachInfo || null
                    });
                }
                
                const hotel = hotelsMap.get(key);
                
                // Add date combination
                const dateInfo = {
                    checkin: result.checkin,
                    checkout: result.checkout,
                    price: result.price
                };
                
                // Check if this date combination already exists
                const dateExists = hotel.dates.some(d => 
                    d.checkin === dateInfo.checkin && d.checkout === dateInfo.checkout
                );
                
                if (!dateExists) {
                    hotel.dates.push(dateInfo);
                }
                
                // Update price if we have one
                if (result.price) {
                    hotel.prices.push(result.price);
                }
                
                // Update review score if we have a better one
                if (result.reviewScore !== null) {
                    if (hotel.reviewScore === null || result.reviewScore > hotel.reviewScore) {
                        hotel.reviewScore = result.reviewScore;
                        hotel.ratingText = result.rating;
                    }
                }
                
                // Update beach info - merge locationScore and beachRating
                if (result.beachInfo) {
                    if (!hotel.beachInfo) {
                        hotel.beachInfo = { ...result.beachInfo };
                    } else {
                        // Merge beachInfo, keeping the best values
                        // Location score: prefer higher score
                        if (result.beachInfo.locationScore !== null && result.beachInfo.locationScore !== undefined) {
                            if (hotel.beachInfo.locationScore === null || 
                                hotel.beachInfo.locationScore === undefined ||
                                result.beachInfo.locationScore > hotel.beachInfo.locationScore) {
                                hotel.beachInfo.locationScore = result.beachInfo.locationScore;
                            }
                        }
                        // Beach rating: prefer higher rating
                        if (result.beachInfo.beachRating !== null && result.beachInfo.beachRating !== undefined) {
                            // Ensure it's a number
                            const rating = typeof result.beachInfo.beachRating === 'string' 
                                ? parseFloat(result.beachInfo.beachRating) 
                                : result.beachInfo.beachRating;
                            if (!isNaN(rating) && rating >= 1 && rating <= 10) {
                                if (hotel.beachInfo.beachRating === null || 
                                    hotel.beachInfo.beachRating === undefined ||
                                    rating > hotel.beachInfo.beachRating) {
                                    hotel.beachInfo.beachRating = rating;
                                    hotel.beachInfo.beachRatingText = result.beachInfo.beachRatingText;
                                }
                            }
                        }
                        // Update summary if we have new info
                        if (result.beachInfo.summary) {
                            hotel.beachInfo.summary = result.beachInfo.summary;
                        }
                    }
                }
            });

            // Sort hotels by review score (descending), then by name
            const hotels = Array.from(hotelsMap.values()).sort((a, b) => {
                if (a.reviewScore !== null && b.reviewScore !== null) {
                    return b.reviewScore - a.reviewScore;
                }
                if (a.reviewScore !== null) return -1;
                if (b.reviewScore !== null) return 1;
                return a.name.localeCompare(b.name);
            });

            // Render hotel view
            const tbody = document.getElementById('hotel-results-tbody');
            if (!tbody) return;

            tbody.innerHTML = '';

            if (hotels.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="padding: 16px; color: #6b7280; font-style: italic; text-align: center;">No properties found</td></tr>';
                return;
            }

            const formatDate = (dateStr) => {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };

            hotels.forEach(hotel => {
                // Sort dates by check-in date
                hotel.dates.sort((a, b) => new Date(a.checkin) - new Date(b.checkin));

                // Format date badges
                const dateBadges = hotel.dates.map(d => {
                    const checkinFormatted = formatDate(d.checkin);
                    const checkoutFormatted = formatDate(d.checkout);
                    return `<span class="date-badge">${checkinFormatted} → ${checkoutFormatted}</span>`;
                }).join('');

                // Calculate price range
                let priceRange = '';
                if (hotel.prices.length > 0) {
                    const priceValues = hotel.prices
                        .map(p => {
                            const match = p.match(/[\d,]+\.?\d*/);
                            return match ? parseFloat(match[0].replace(/,/g, '')) : null;
                        })
                        .filter(p => p !== null);
                    
                    if (priceValues.length > 0) {
                        const minPrice = Math.min(...priceValues);
                        const maxPrice = Math.max(...priceValues);
                        const currency = hotel.prices[0].match(/[€$£¥]/)?.[0] || '';
                        if (minPrice === maxPrice) {
                            priceRange = `${currency}${minPrice.toFixed(0)}`;
                        } else {
                            priceRange = `${currency}${minPrice.toFixed(0)} - ${currency}${maxPrice.toFixed(0)}`;
                        }
                    } else {
                        priceRange = hotel.prices[0]; // Fallback to first price string
                    }
                }

                // Format review score
                const reviewDisplay = hotel.reviewScore !== null && hotel.reviewScore !== undefined
                    ? hotel.reviewScore.toFixed(1)
                    : '';

                // Format dates display - show count if many dates
                let datesDisplay = '';
                if (hotel.dates.length === 0) {
                    datesDisplay = '<span style="color: #9ca3af;">—</span>';
                } else if (hotel.dates.length <= 5) {
                    // Show all date badges if 5 or fewer
                    datesDisplay = hotel.dates.map(d => {
                        const checkinFormatted = formatDate(d.checkin);
                        const checkoutFormatted = formatDate(d.checkout);
                        return `<span class="date-badge">${checkinFormatted} → ${checkoutFormatted}</span>`;
                    }).join('');
                } else {
                    // Show first 3 and count
                    const firstThree = hotel.dates.slice(0, 3).map(d => {
                        const checkinFormatted = formatDate(d.checkin);
                        const checkoutFormatted = formatDate(d.checkout);
                        return `<span class="date-badge">${checkinFormatted} → ${checkoutFormatted}</span>`;
                    }).join('');
                    datesDisplay = `${firstThree}<span style="color: #6b7280; font-size: 0.875rem; margin-left: 8px; display: inline-block; padding-top: 4px;">+${hotel.dates.length - 3} more</span>`;
                }

                // Format beach info - show location score and beach rating
                // Check if beachInfo is being loaded (currently fetching)
                const hotelNormalizedUrl = hotel.url ? searcher.normalizePropertyUrl(hotel.url) : null;
                const isBeachInfoLoading = hotelNormalizedUrl && 
                    searcher.beachInfoFetching && 
                    searcher.beachInfoFetching.has(hotelNormalizedUrl);
                
                let beachInfoDisplay = '';
                if (isBeachInfoLoading) {
                    beachInfoDisplay = '<span style="color: #6b7280; font-size: 0.875rem; font-style: italic;">Loading...</span>';
                } else if (hotel.beachInfo) {
                    const parts = [];
                    
                    // Always show location score if available
                    if (hotel.beachInfo.locationScore !== null && 
                        hotel.beachInfo.locationScore !== undefined && 
                        !isNaN(hotel.beachInfo.locationScore)) {
                        const locationScore = hotel.beachInfo.locationScore;
                        const scoreColor = locationScore >= 8 ? '#059669' : locationScore >= 6 ? '#f59e0b' : '#dc2626';
                        parts.push(`<span style="color: ${scoreColor}; font-size: 0.875rem; font-weight: 500;">Location: ${locationScore}/10</span>`);
                    }
                    
                    // Show beach rating if available (optional)
                    console.log(`[Hotel View] Hotel ${hotel.name} beachInfo:`, hotel.beachInfo);
                    console.log(`[Hotel View] Checking beachRating: ${hotel.beachInfo.beachRating}, type: ${typeof hotel.beachInfo.beachRating}, isNaN: ${isNaN(hotel.beachInfo.beachRating)}`);
                    
                    // Convert to number if it's a string and validate
                    let beachRatingValue = hotel.beachInfo.beachRating;
                    if (typeof beachRatingValue === 'string') {
                        beachRatingValue = parseFloat(beachRatingValue);
                    }
                    
                    // Round to 1 decimal place and validate
                    if (beachRatingValue !== null && 
                        beachRatingValue !== undefined && 
                        !isNaN(beachRatingValue)) {
                        beachRatingValue = Math.round(beachRatingValue * 10) / 10;
                        
                        // "Top-rated beach nearby" should have a reasonable rating (at least 4.0)
                        if (beachRatingValue >= 4.0 && beachRatingValue <= 10) {
                            const beachColor = beachRatingValue >= 8 ? '#059669' : beachRatingValue >= 6 ? '#f59e0b' : '#dc2626';
                            parts.push(`<span style="color: ${beachColor}; font-size: 0.875rem; font-weight: 500;">Beach: ${beachRatingValue}/10</span>`);
                            console.log(`[Hotel View] Added beach rating to display: ${beachRatingValue}`);
                        } else {
                            console.log(`[Hotel View] Beach rating ${beachRatingValue} is out of valid range (4.0-10.0), not displaying`);
                        }
                    }
                    
                    // Show beachRatingText as fallback only if we don't have a valid numeric rating
                    if (parts.length === 0 || (parts.length === 1 && parts[0].includes('Location:'))) {
                        if (hotel.beachInfo.beachRatingText) {
                            parts.push(`<span style="color: #4b5563; font-size: 0.875rem;">${escapeHtml(hotel.beachInfo.beachRatingText)}</span>`);
                            console.log(`[Hotel View] Added beachRatingText to display: ${hotel.beachInfo.beachRatingText}`);
                        }
                    }
                    
                    // Show closest beach distance if available
                    if (hotel.beachInfo.closestBeachDistance) {
                        const beachDisplay = hotel.beachInfo.closestBeachName 
                            ? `${escapeHtml(hotel.beachInfo.closestBeachName)}: ${escapeHtml(hotel.beachInfo.closestBeachDistance)}`
